openapi: 3.1.0
info:
  title: API de Registro de Estudiantes e Inscripción Académica
  version: 1.0.0
  description: Contrato canónico de API REST para el Sistema de Registro de Estudiantes y Selección de Materias. Sincronizado estrictamente con los controladores de ASP.NET Core 8, el patrón de envoltura Result<T>, CQRS y especificaciones de dominio.
servers:
  - url: /api/v1
    description: Servidor de API v1

paths:
  /auth/register:
    post:
      summary: Registro en línea de estudiante
      description: Registra una nueva cuenta de estudiante adhiriéndose al programa de créditos.
      operationId: registerStudent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterStudentRequest'
      responses:
        '201':
          description: Estudiante registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          description: Datos inválidos o contraseña menor a 6 caracteres
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '409':
          description: Documento o correo electrónico ya registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '500':
          description: Error interno no controlado del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/login:
    post:
      summary: Inicio de sesión
      description: Autentica un usuario (Estudiante o Administrador) y devuelve un token Bearer JWT con su perfil.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '500':
          description: Error interno no controlado del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /students:
    get:
      summary: Lista pública de estudiantes registrados
      description: Retorna la lista de todos los estudiantes registrados exponiendo únicamente su nombre completo por privacidad.
      operationId: getPublicStudents
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Listado obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStudentsResult'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResult'
        '500':
          description: Error interno no controlado del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /students/me:
    get:
      summary: Perfil del estudiante autenticado
      description: Retorna la información del perfil del estudiante en sesión incluyendo total de créditos y materias inscritas.
      operationId: getCurrentStudentProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Perfil obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResult'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResult'
        '404':
          description: Perfil de estudiante no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResult'
        '500':
          description: Error interno no controlado del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /students/me/enrollments:
    get:
      summary: Materias inscritas del estudiante autenticado
      description: Retorna el resumen de asignaturas inscritas por el estudiante, cupos de créditos (0 a 9) y materias cursadas.
      operationId: getMyEnrollments
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Inscripciones obtenidas exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentEnrollmentSummaryResult'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResult'
        '500':
          description: Error interno no controlado del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    post:
      summary: Inscribir una asignatura
      description: Inscribe una materia validando el límite máximo de 3 materias (9 créditos) y la regla innegociable de no repetir profesor.
      operationId: enrollCourse
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollCourseRequest'
      responses:
        '201':
          description: Materia inscrita exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentEnrollmentSummaryResult'
        '400':
          description: Límite de créditos/materias superado o violación de regla de profesor repetido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentEnrollmentSummaryResult'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResult'
        '409':
          description: Materia ya se encuentra inscrita en la carga académica
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentEnrollmentSummaryResult'
        '500':
          description: Error interno no controlado del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /students/me/enrollments/{courseId}:
    delete:
      summary: Retirar una asignatura inscrita
      description: Cancela la inscripción de una materia liberando créditos.
      operationId: dropCourse
      security:
        - BearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Materia retirada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentEnrollmentSummaryResult'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResult'
        '404':
          description: La materia no se encuentra inscrita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentEnrollmentSummaryResult'
        '500':
          description: Error interno no controlado del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /courses:
    get:
      summary: Catálogo de materias ofertadas
      description: Retorna la lista de asignaturas ofertadas con su código, créditos (3 c/u) y profesor asignado.
      operationId: getCourses
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Catálogo obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursesResult'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResult'
        '500':
          description: Error interno no controlado del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /courses/{courseId}/classmates:
    get:
      summary: Compañeros de clase de una asignatura
      description: Retorna exclusivamente los nombres completos de los estudiantes que comparten una materia.
      operationId: getCourseClassmates
      security:
        - BearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de compañeros obtenida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassmatesResult'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResult'
        '404':
          description: Materia no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassmatesResult'
        '500':
          description: Error interno no controlado del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /admin/professors:
    get:
      summary: Listar todos los profesores (Admin)
      description: Retorna la lista de docentes activos disponibles en la institución.
      operationId: adminGetProfessors
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Listado de profesores obtenido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessorsResult'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResult'
        '500':
          description: Error interno no controlado del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    post:
      summary: Crear profesor (Admin)
      description: Registra un nuevo docente en la planta institucional.
      operationId: adminCreateProfessor
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateProfessorRequest'
      responses:
        '201':
          description: Profesor creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessorResult'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessorResult'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResult'
        '409':
          description: Ya existe un docente con el correo electrónico proporcionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessorResult'
        '500':
          description: Error interno no controlado del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /admin/professors/{id}:
    delete:
      summary: Desactivar o eliminar profesor (Admin)
      description: Elimina un docente siempre que no tenga materias asignadas con alumnos inscritos.
      operationId: adminDeleteProfessor
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Docente eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResult'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResult'
        '404':
          description: Docente no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResult'
        '409':
          description: Conflicto, el docente tiene asignaturas activas asignadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResult'
        '500':
          description: Error interno no controlado del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /admin/courses:
    get:
      summary: Listar todas las materias (Admin)
      description: Retorna el catálogo completo de asignaturas académicas.
      operationId: adminGetCourses
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Listado de materias obtenido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursesResult'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResult'
        '500':
          description: Error interno no controlado del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    post:
      summary: Crear materia (Admin)
      description: Registra una nueva asignatura asignándole código, nombre y profesor responsable (créditos fijados en 3 automáticamente).
      operationId: adminCreateCourse
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateCourseRequest'
      responses:
        '201':
          description: Materia creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResult'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResult'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResult'
        '409':
          description: Ya existe una asignatura con el código proporcionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResult'
        '500':
          description: Error interno no controlado del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /admin/courses/{id}:
    delete:
      summary: Desactivar o eliminar materia (Admin)
      description: Elimina una materia curricular siempre que no tenga alumnos matriculados.
      operationId: adminDeleteCourse
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Materia eliminada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResult'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResult'
        '404':
          description: Materia no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResult'
        '409':
          description: Conflicto, la materia posee inscripciones activas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResult'
        '500':
          description: Error interno no controlado del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorType:
      type: integer
      description: Código numérico del tipo de resultado o error funcional
      enum:
        - 0 # None
        - 1 # Validation
        - 2 # BadRequest
        - 3 # Unauthorized
        - 4 # Forbidden
        - 5 # NotFound
        - 6 # Conflict
        - 7 # InternalServerError
      example: 0

    BaseResult:
      type: object
      description: Envoltura canónica Result para operaciones sin valor de retorno
      required:
        - isSuccess
        - errors
        - errorType
      properties:
        isSuccess:
          type: boolean
          example: true
        message:
          type: string
          nullable: true
          example: 'Operación completada exitosamente.'
        errors:
          type: array
          items:
            type: string
          example: []
        result:
          type: object
          nullable: true
          example: null
        errorType:
          $ref: '#/components/schemas/ErrorType'

    AuthResult:
      type: object
      required:
        - isSuccess
        - errors
        - errorType
      properties:
        isSuccess:
          type: boolean
          example: true
        message:
          type: string
          nullable: true
        errors:
          type: array
          items:
            type: string
        result:
          $ref: '#/components/schemas/AuthResponse'
        errorType:
          $ref: '#/components/schemas/ErrorType'

    PublicStudentsResult:
      type: object
      required:
        - isSuccess
        - errors
        - errorType
      properties:
        isSuccess:
          type: boolean
          example: true
        message:
          type: string
          nullable: true
        errors:
          type: array
          items:
            type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/PublicStudentDto'
        errorType:
          $ref: '#/components/schemas/ErrorType'

    StudentProfileResult:
      type: object
      required:
        - isSuccess
        - errors
        - errorType
      properties:
        isSuccess:
          type: boolean
          example: true
        message:
          type: string
          nullable: true
        errors:
          type: array
          items:
            type: string
        result:
          $ref: '#/components/schemas/StudentProfileDto'
        errorType:
          $ref: '#/components/schemas/ErrorType'

    StudentEnrollmentSummaryResult:
      type: object
      required:
        - isSuccess
        - errors
        - errorType
      properties:
        isSuccess:
          type: boolean
          example: true
        message:
          type: string
          nullable: true
        errors:
          type: array
          items:
            type: string
        result:
          $ref: '#/components/schemas/StudentEnrollmentSummaryDto'
        errorType:
          $ref: '#/components/schemas/ErrorType'

    CoursesResult:
      type: object
      required:
        - isSuccess
        - errors
        - errorType
      properties:
        isSuccess:
          type: boolean
          example: true
        message:
          type: string
          nullable: true
        errors:
          type: array
          items:
            type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/CourseDto'
        errorType:
          $ref: '#/components/schemas/ErrorType'

    ClassmatesResult:
      type: object
      required:
        - isSuccess
        - errors
        - errorType
      properties:
        isSuccess:
          type: boolean
          example: true
        message:
          type: string
          nullable: true
        errors:
          type: array
          items:
            type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/ClassmateDto'
        errorType:
          $ref: '#/components/schemas/ErrorType'

    ProfessorsResult:
      type: object
      required:
        - isSuccess
        - errors
        - errorType
      properties:
        isSuccess:
          type: boolean
          example: true
        message:
          type: string
          nullable: true
        errors:
          type: array
          items:
            type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/ProfessorDto'
        errorType:
          $ref: '#/components/schemas/ErrorType'

    ProfessorResult:
      type: object
      required:
        - isSuccess
        - errors
        - errorType
      properties:
        isSuccess:
          type: boolean
          example: true
        message:
          type: string
          nullable: true
        errors:
          type: array
          items:
            type: string
        result:
          $ref: '#/components/schemas/ProfessorDto'
        errorType:
          $ref: '#/components/schemas/ErrorType'

    CourseResult:
      type: object
      required:
        - isSuccess
        - errors
        - errorType
      properties:
        isSuccess:
          type: boolean
          example: true
        message:
          type: string
          nullable: true
        errors:
          type: array
          items:
            type: string
        result:
          $ref: '#/components/schemas/CourseDto'
        errorType:
          $ref: '#/components/schemas/ErrorType'

    RegisterStudentRequest:
      type: object
      required:
        - fullName
        - identificationNumber
        - email
        - password
      properties:
        fullName:
          type: string
          example: 'Carlos Alberto Perez'
        identificationNumber:
          type: string
          example: '1020304050'
        email:
          type: string
          format: email
          example: 'carlos.perez@universidad.edu.co'
        password:
          type: string
          format: password
          minLength: 6
          example: 'Segura123!'

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: 'carlos.perez@universidad.edu.co'
        password:
          type: string
          format: password
          example: 'Segura123!'

    AuthResponse:
      type: object
      required:
        - token
        - expiresInSeconds
        - user
      properties:
        token:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        expiresInSeconds:
          type: integer
          example: 86400
        user:
          $ref: '#/components/schemas/UserProfileDto'

    UserProfileDto:
      type: object
      required:
        - id
        - fullName
        - email
        - role
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          example: 'Carlos Alberto Perez'
        email:
          type: string
          format: email
          example: 'carlos.perez@universidad.edu.co'
        role:
          type: string
          enum: [Estudiante, Administrador]
          example: 'Estudiante'

    PublicStudentDto:
      type: object
      required:
        - id
        - fullName
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          example: 'Carlos Alberto Perez'

    StudentProfileDto:
      type: object
      required:
        - id
        - fullName
        - identificationNumber
        - email
        - totalCredits
        - enrolledCoursesCount
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          example: 'Carlos Alberto Perez'
        identificationNumber:
          type: string
          example: '1020304050'
        email:
          type: string
          format: email
          example: 'carlos.perez@universidad.edu.co'
        totalCredits:
          type: integer
          example: 6
        enrolledCoursesCount:
          type: integer
          example: 2

    ProfessorDto:
      type: object
      required:
        - id
        - fullName
        - email
        - isAvailable
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          example: 'Prof. Andrés Gómez'
        email:
          type: string
          format: email
          example: 'andres.gomez@universidad.edu.co'
        isAvailable:
          type: boolean
          example: true

    CourseDto:
      type: object
      required:
        - id
        - code
        - name
        - credits
        - professor
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: 'MAT-101'
        name:
          type: string
          example: 'Cálculo Diferencial'
        credits:
          type: integer
          example: 3
        professor:
          $ref: '#/components/schemas/ProfessorDto'

    EnrollCourseRequest:
      type: object
      required:
        - courseId
      properties:
        courseId:
          type: string
          format: uuid

    EnrolledCourseItemDto:
      type: object
      required:
        - enrollmentId
        - courseId
        - courseCode
        - courseName
        - credits
        - professorId
        - professorName
        - enrolledAtUtc
      properties:
        enrollmentId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        courseCode:
          type: string
          example: 'MAT-101'
        courseName:
          type: string
          example: 'Cálculo Diferencial'
        credits:
          type: integer
          example: 3
        professorId:
          type: string
          format: uuid
        professorName:
          type: string
          example: 'Prof. Andrés Gómez'
        enrolledAtUtc:
          type: string
          format: date-time

    StudentEnrollmentSummaryDto:
      type: object
      required:
        - totalCredits
        - maxCredits
        - enrolledCoursesCount
        - maxCourses
        - courses
      properties:
        totalCredits:
          type: integer
          example: 6
        maxCredits:
          type: integer
          example: 9
        enrolledCoursesCount:
          type: integer
          example: 2
        maxCourses:
          type: integer
          example: 3
        courses:
          type: array
          items:
            $ref: '#/components/schemas/EnrolledCourseItemDto'

    ClassmateDto:
      type: object
      required:
        - id
        - fullName
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          example: 'María Fernanda Ruiz'

    AdminCreateProfessorRequest:
      type: object
      required:
        - fullName
        - email
      properties:
        fullName:
          type: string
          example: 'Prof. Roberto Silva'
        email:
          type: string
          format: email
          example: 'roberto.silva@universidad.edu.co'

    AdminCreateCourseRequest:
      type: object
      required:
        - code
        - name
        - professorId
      properties:
        code:
          type: string
          example: 'PROG-102'
        name:
          type: string
          example: 'Estructuras de Datos'
        professorId:
          type: string
          format: uuid

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          example: 'https://tools.ietf.org/html/rfc7807'
        title:
          type: string
          example: 'Error Interno del Servidor'
        status:
          type: integer
          example: 500
        detail:
          type: string
          example: 'Ocurrió un error inesperado al procesar la solicitud.'
        instance:
          type: string
          example: '/api/v1/students/me/enrollments'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
