<header class="navbar-header">
  <div class="navbar-container">
    <div class="brand-group">
      <div class="brand-badge">
        IR
      </div>
      <span class="brand-title">Registro Académico</span>
    </div>

    @if (authService.isAuthenticated()) {
      <nav class="nav-links">
        <a routerLink="/catalog" routerLinkActive="active-nav" class="nav-link">Catálogo</a>
        <a routerLink="/my-enrollments" routerLinkActive="active-nav" class="nav-link">
          Mis Materias
          @if (academicService.myEnrollments(); as summary) {
            <span class="credits-badge">
              {{ summary.totalCredits }}/9 CR
            </span>
          }
        </a>
        <a routerLink="/students" routerLinkActive="active-nav" class="nav-link">Estudiantes</a>
        
        @if (authService.isAdmin()) {
          <a routerLink="/admin" routerLinkActive="active-nav" class="nav-link nav-admin">Admin</a>
        }

        <div class="user-profile-group">
          <span class="user-name">{{ authService.currentUser()?.fullName }}</span>
          <button (click)="authService.logout()" class="btn-logout">
            Salir
          </button>
        </div>
      </nav>
    } @else {
      <div class="auth-buttons">
        <a routerLink="/login" class="btn-login">Ingresar</a>
        <a routerLink="/register" class="btn-register">Registrarse</a>
      </div>
    }
  </div>
</header>
